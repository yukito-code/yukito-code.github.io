<title>AI活用 無料特典一覧</title><style>
:root{color-scheme:light;--ink:#11243b;--line:#e2e9f0;--bg:#f8fafc;--accent:#086a88}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:focus-visible{outline:3px solid #28b99c;outline-offset:4px}
.container{width:min(1120px,calc(100% - 40px));margin-inline:auto}
.site-header{color:white;background:radial-gradient(ellipse 78% 155% at 100% -18%,rgba(33,138,130,.27),transparent 70%),linear-gradient(115deg,#09182f 0%,#102343 65%,#0d3044 100%);border-bottom:1px solid rgba(76,208,188,.25)}
.site-header .container{padding:53px 0 49px}
.site-header h1{text-align:center;font-size:clamp(27px,3.5vw,38px);line-height:1.4;letter-spacing:-.045em;margin:0;font-weight:800}
.site-header h1 em{font-style:normal;color:#a4f5d4}
main{padding-top:32px;padding-bottom:72px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:19px}
.book{display:flex;flex-direction:column;min-width:0;background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .2s,box-shadow .2s,transform .2s}
.book:hover{transform:translateY(-4px);border-color:#b7cbd4;box-shadow:0 14px 30px rgba(18,43,74,.10)}
.thumb{padding:24px 24px 20px;background:#edf3f6;display:flex;align-items:center;justify-content:center}
.book:nth-child(2) .thumb{background:#eef1f8}.book:nth-child(3) .thumb{background:#ecf5f1}.book:nth-child(4) .thumb{background:#eaf1f5}
.thumb img{display:block;width:100%;height:auto;aspect-ratio:595/842;object-fit:contain;box-shadow:0 9px 18px rgba(14,32,60,.13);border-radius:2px}
.book-info{padding:19px 17px 18px;display:flex;flex-direction:column;flex:1}
.book-info h2{font-size:16px;line-height:1.57;letter-spacing:-.035em;margin:0 0 17px;font-weight:750;flex:1}
.open{display:flex;justify-content:space-between;gap:6px;align-items:center;padding-top:14px;border-top:1px solid #e8edf2;color:var(--accent);font-size:13px;font-weight:700}
.open svg{width:17px;height:17px;flex:none}
@media(max-width:920px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.thumb{padding:24px 24% 20px}}
@media(max-width:550px){.site-header .container{padding:38px 0 36px}.site-header h1{font-size:26px}.container{width:min(100% - 30px,460px)}main{padding-top:20px;padding-bottom:40px}.grid{grid-template-columns:1fr;gap:18px}.thumb{padding:24px 22% 20px}.book-info{padding:18px 20px 17px}.book-info h2{font-size:17px}.open{font-size:13px}}
@media(prefers-reduced-motion:reduce){.book{transition:none}.book:hover{transform:none}}
</style></head>
