:root{--bg:#0a0a14;--surface:#14142a;--surface2:#1e1e38;--border:#2a2a4a;--text:#e8e8f0;--dim:#8888a0;--accent:#6c5ce7;--accent2:#a29bfe;--pink:#fd79a8;--green:#00cec9;--orange:#fdcb6e;--blue:#74b9ff;--red:#ff7675;--linec:#06c755}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.ctn{max-width:780px;margin:0 auto;padding:24px 20px 48px}
.intro{text-align:center;animation:fu .6s ease}
.intro h1{font-size:34px;line-height:1.4;margin-bottom:12px;margin-top:24px}
.intro h1 span{color:var(--accent2)}
.intro .sub{color:var(--dim);font-size:16px;margin-bottom:36px;line-height:1.7}
.axes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:32px;text-align:left}
.ax{background:var(--surface);border-radius:10px;padding:14px 16px;border-left:3px solid var(--accent)}
.ax:nth-child(2){border-left-color:var(--green)}
.ax:nth-child(3){border-left-color:var(--orange)}
.ax:nth-child(4){border-left-color:var(--pink)}
.ax:nth-child(5){border-left-color:var(--blue);grid-column:1/3}
.ax .n{font-size:13px;color:var(--dim)}
.ax .nm{font-size:15px;font-weight:bold;margin-top:2px}
.sbtn{background:linear-gradient(135deg,var(--accent),var(--pink));color:#fff;border:none;padding:18px 56px;border-radius:30px;font-size:19px;font-weight:bold;cursor:pointer;transition:transform .2s,box-shadow .2s}
.sbtn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(108,92,231,.4)}
.quiz{display:none;animation:fu .5s ease}
.pbar{background:var(--surface);border-radius:10px;height:8px;overflow:hidden;margin-bottom:8px}
.pfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));border-radius:10px;transition:width .3s ease}
.ptxt{font-size:14px;color:var(--dim);text-align:right;margin-bottom:16px}
.clbl{font-size:14px;color:var(--accent2);margin-bottom:6px;letter-spacing:1px}
.qc{background:var(--surface);border-radius:16px;padding:28px 24px;margin-bottom:16px;border:1px solid var(--border)}
.qn{font-size:14px;color:var(--dim);margin-bottom:6px}
.qt{font-size:17px;line-height:1.7;margin-bottom:24px}
.opts{display:flex;flex-direction:column;gap:10px}
.ob{background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:16px 18px;color:var(--text);font-size:16px;cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:10px}
.ob:hover{border-color:var(--accent);background:rgba(108,92,231,.08)}
.ob.sel{border-color:var(--accent);background:rgba(108,92,231,.15)}
.ob .dt{width:20px;height:20px;border-radius:50%;border:2px solid var(--dim);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ob.sel .dt{border-color:var(--accent);background:var(--accent)}
.ob.sel .dt::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
.nbtn{margin-top:20px}
.pbtn{width:100%;padding:16px;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;border:none;background:var(--surface2);color:var(--dim);transition:all .2s}
.pbtn:hover{background:var(--border)}
.pbtn:disabled{opacity:.3;cursor:not-allowed}
.result{display:none;animation:fu .6s ease;text-align:center}
.rh{margin-bottom:24px}
.lb{display:inline-block;font-size:16px;padding:6px 20px;border-radius:20px;margin-bottom:12px}
.result h2{font-size:30px;margin-bottom:4px}
.ln{font-size:24px;font-weight:bold;margin-bottom:6px}
.st{font-size:16px;color:var(--dim)}
.rw{margin:28px auto;max-width:100%;overflow:visible;padding:0 10px}
.rw canvas{width:100%;height:auto}
.abrs{text-align:left;margin:0 auto 28px;max-width:560px}
.abr{margin-bottom:14px}
.abh{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px}
.abn{font-weight:bold}
.abs{color:var(--accent2)}
.abt{background:var(--surface);border-radius:6px;height:12px;overflow:hidden}
.abf{height:100%;border-radius:6px;transition:width 1s ease}
.sbox{background:var(--surface);border-radius:16px;padding:24px;margin-bottom:20px;text-align:left}
.sbox h3{font-size:17px;margin-bottom:10px}
.tag{display:inline-block;padding:6px 14px;border-radius:8px;font-size:15px}
.sbox p{font-size:15px;color:var(--dim);margin-top:8px;line-height:1.6}
.advb{background:var(--surface);border-radius:16px;padding:28px 24px;margin-bottom:24px;text-align:left;border-left:4px solid var(--accent)}
.advb h3{font-size:18px;margin-bottom:10px}
.advb p{font-size:16px;color:var(--dim);line-height:1.8;margin-bottom:12px}
.cta{background:linear-gradient(135deg,rgba(108,92,231,.15),rgba(253,121,168,.1));border:1px solid var(--accent);border-radius:16px;padding:32px 24px;margin-bottom:20px}
.cta h3{font-size:18px;margin-bottom:8px}
.cta p{font-size:15px;color:var(--dim);margin-bottom:16px;line-height:1.7}
.lbtn{display:inline-block;background:var(--linec);color:#fff;padding:16px 42px;border-radius:30px;font-size:17px;font-weight:bold;text-decoration:none;transition:transform .2s}
.lbtn:hover{transform:translateY(-2px)}
.rbtn{margin-top:20px;background:var(--surface2);color:var(--dim);border:1px solid var(--border);padding:14px 36px;border-radius:12px;font-size:16px;cursor:pointer}
.rbtn:hover{border-color:var(--accent);color:var(--text)}
@keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.intro h1{font-size:26px}.axes{grid-template-columns:1fr}.ax:nth-child(5){grid-column:auto}.qt{font-size:14px}}
</style>
</head>
